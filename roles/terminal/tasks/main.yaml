---
- name: Install better terminal tools
  become: true
  ansible.builtin.apt:
    state: present
    update_cache: true
    pkg: "{{ terminal_apt_packages }}"

- name: Create the FiraCode Nerd Font directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/FiraCodeNerdFont"
    state: directory
    mode: "0755"

- name: Download and extract the FiraCode Nerd Font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.tar.xz
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/FiraCodeNerdFont"
    remote_src: true
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/fonts/FiraCodeNerdFont/FiraCodeNerdFont-Regular.ttf"
  register: terminal_firacode_font

- name: Rebuild the font cache
  ansible.builtin.command:
    cmd: fc-cache -f
  when: terminal_firacode_font.changed
  changed_when: true

- name: Set qterminal transparency to 0
  community.general.ini_file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/qterminal.org/qterminal.ini"
    section: General
    option: TerminalTransparency
    value: "0"
    mode: '0644'

- name: Add useful aliases to ~/.zshrc & source fzf
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.zshrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - terminal aliases"
    append_newline: true
    prepend_newline: true
    block: |
      alias lla='ls -la'
      alias llh='ls -lh'
      alias nmap='sudo nmap'
      alias cat='batcat'
      alias catp='batcat --style plain'
      alias grep='rg'
      alias nano='nano -l -m'
      alias find='fdfind'
      alias fd='fdfind'
      source <(fzf --zsh)

- name: Copy the improved vim config
  become: true
  ansible.builtin.copy:
    src: vimrc
    dest: "/etc/vim/vimrc"
    mode: '0644'
