---
- name: Install NVM and Node.js LTS
  block:
    - name: Check if nvm is already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/nvm/nvm.sh"
      register: tools_nvm_installed

    - name: Get latest nvm version
      ansible.builtin.uri:
        url: https://api.github.com/repos/nvm-sh/nvm/releases/latest
        return_content: true
      register: tools_nvm_version_response
      when: not tools_nvm_installed.stat.exists

    - name: Set nvm version fact
      ansible.builtin.set_fact:
        tools_nvm_version: "{{ (tools_nvm_version_response.content | from_json).tag_name }}"
      when: not tools_nvm_installed.stat.exists

    # The version lookup above is skipped when nvm is already installed, in which
    # case the installer is never downloaded and the fallback branch is unused.
    - name: Install nvm
      ansible.builtin.include_tasks: _install_script.yaml
      vars:
        tools_install_script:
          name: nvm
          url: "https://raw.githubusercontent.com/nvm-sh/nvm/{{ tools_nvm_version | default('master') }}/install.sh"
          creates: "{{ ansible_facts['env']['HOME'] }}/.config/nvm/nvm.sh"
          env:
            NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.config/nvm"

    - name: Install Node.js LTS via nvm
      ansible.builtin.shell: |
        source {{ ansible_facts['env']['HOME'] }}/.config/nvm/nvm.sh
        nvm install --lts
      args:
        executable: /bin/bash
      environment:
        NVM_DIR: "{{ ansible_facts['env']['HOME'] }}/.config/nvm"
      when: not tools_nvm_installed.stat.exists
      changed_when: true
