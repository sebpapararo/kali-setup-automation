---
- name: Check whether Ghidra is installed
  ansible.builtin.stat:
    path: /usr/share/ghidra/Ghidra/application.properties
  register: tools_ghidra_appprops_stat

- name: Customise Ghidra
  when: tools_ghidra_appprops_stat.stat.exists
  block:
    - name: Read Ghidra application properties
      ansible.builtin.slurp:
        src: /usr/share/ghidra/Ghidra/application.properties
      register: tools_ghidra_appprops

    - name: Determine Ghidra version and release name
      ansible.builtin.set_fact:
        # The settings directory is named after ApplicationIdentifier.toString(),
        # which is "<name>_<version>_<release name>" e.g. ghidra_12.0_PUBLIC.
        tools_ghidra_version: "{{ tools_ghidra_appprops.content | b64decode | regex_search('application.version=([0-9.]+)', '\\1') | first }}"
        tools_ghidra_release: >-
          {{ tools_ghidra_appprops.content | b64decode
             | regex_search('application.release.name=(\S+)', '\1')
             | default(['PUBLIC'], true) | first }}

    - name: Set Ghidra settings directory fact
      ansible.builtin.set_fact:
        # Ghidra 11.1+ stores user settings under $XDG_CONFIG_HOME (default $HOME/.config)
        tools_ghidra_settings_dir: >-
          {{ ansible_facts['env']['XDG_CONFIG_HOME']
             | default(ansible_facts['env']['HOME'] ~ '/.config', true)
          }}/ghidra/ghidra_{{ tools_ghidra_version }}_{{ tools_ghidra_release }}

    - name: Create Ghidra themes and tools directories
      ansible.builtin.file:
        path: "{{ tools_ghidra_settings_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - themes
        - tools

    - name: Copy the Flat Dark Theme (Mine) into Ghidra
      ansible.builtin.copy:
        src: "Flat_Dark_Theme_(Mine).theme"
        dest: "{{ tools_ghidra_settings_dir }}/themes/Flat_Dark_Theme_(Mine).theme"
        mode: "0644"

    - name: Select the Flat Dark Theme (Mine) as the active theme
      # ThemePreferences only understands "File:<absolute path>" or "Class:<class name>"
      # theme IDs; a bare theme name silently falls back to the default theme.
      ansible.builtin.lineinfile:
        path: "{{ tools_ghidra_settings_dir }}/preferences"
        regexp: '^Theme='
        line: "Theme=File:{{ tools_ghidra_settings_dir }}/themes/Flat_Dark_Theme_(Mine).theme"
        create: true
        mode: "0644"

    - name: Deploy the exported CodeBrowser tool configuration
      # The tool chest only loads *.tcd files (.tool is the import/export extension). The
      # default-tool association for opening a Program is keyed to the tool chest entry
      # Ghidra itself extracts on first run, whose filename is derived from the internal
      # TOOL_NAME ("CodeBrowser" -> "_code_browser.tcd", underscore before each internal
      # capital, lowercased) — not the literal tool name. A file named CodeBrowser.tcd
      # is imported as an unrelated extra tool and never used when opening a program.
      ansible.builtin.copy:
        src: "Ghidra Tool.tool"
        dest: "{{ tools_ghidra_settings_dir }}/tools/_code_browser.tcd"
        mode: "0644"
