---
- name: Add Trivy signing key
  become: true
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /etc/apt/keyrings/trivy.asc
    mode: "0644"

- name: Add Trivy APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: trivy
    types: deb
    uris: https://aquasecurity.github.io/trivy-repo/deb
    suites: generic
    components: main
    signed_by: /etc/apt/keyrings/trivy.asc
    state: present

- name: Add Bruno signing key
  become: true
  ansible.builtin.get_url:
    url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x9FA6017ECABE0266"
    dest: /etc/apt/keyrings/bruno.asc
    mode: "0644"

- name: Add Bruno APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: bruno
    types: deb
    architectures: amd64
    uris: http://debian.usebruno.com/
    suites: bruno
    components: stable
    signed_by: /etc/apt/keyrings/bruno.asc
    state: present

- name: Install tools via APT
  become: true
  ansible.builtin.apt:
    state: present
    update_cache: true
    pkg: "{{ tools_apt_packages }}"

- name: Remove unnecessary tools
  become: true
  ansible.builtin.apt:
    state: absent
    pkg: "{{ tools_apt_packages_absent }}"

- name: Check rockyou.txt.gz hasn't already been removed
  ansible.builtin.stat:
    path: "/usr/share/seclists/Passwords/Leaked-Databases/rockyou.txt.tar.gz"
  register: tools_rockyou_gz

- name: Extract rockyou.txt
  when: tools_rockyou_gz.stat.exists
  become: true
  ansible.builtin.unarchive:
    src: /usr/share/seclists/Passwords/Leaked-Databases/rockyou.txt.tar.gz
    dest: /usr/share/seclists/Passwords/Leaked-Databases
    remote_src: true
    owner: root
    group: root
    mode: '0644'

- name: Remove compressed copies of rockyou.txt
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/seclists/Passwords/Leaked-Databases/rockyou.txt.tar.gz
    - /usr/share/wordlists/rockyou.txt.gz

- name: Remove dependencies that are no longer required and purge their configuration files
  become: true
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Perform first run of Nuclei to download templates
  ansible.builtin.command:
    cmd: /usr/bin/nuclei -update-templates
  changed_when: true
