---
- name: Create the tool directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Documents/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "tools"
    - "tools/pspy"

- name: Get latest checksec version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/slimm609/checksec/releases/latest
    return_content: true
  register: tools_checksec_release
  changed_when: false

- name: Extract the checksec version into a variable
  ansible.builtin.set_fact:
    tools_checksec_version: "{{ tools_checksec_release.json.tag_name }}"

- name: Install checksec .deb package
  become: true
  ansible.builtin.apt:
    deb: "https://github.com/slimm609/checksec/releases/latest/download/checksec_{{ tools_checksec_version }}_amd64.deb"

- name: Remove the pwntools checksec binary as it conflicts with this one and is worse
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/checksec"
    state: absent

- name: Download PrivescCheck.ps1
  ansible.builtin.get_url:
    url: https://github.com/itm4n/PrivescCheck/releases/latest/download/PrivescCheck.ps1
    dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/PrivescCheck.ps1"
    mode: "0644"

- name: Download pspy binaries
  ansible.builtin.get_url:
    url: https://github.com/DominicBreuker/pspy/releases/latest/download/{{ item }}
    dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/pspy/{{ item }}"
    mode: "0755"
  retries: 3
  delay: 3
  loop:
    - pspy32
    - pspy64
    - pspy32s
    - pspy64s

- name: Download linux-exploit-suggester.ps1
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/mzet-/linux-exploit-suggester/master/linux-exploit-suggester.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/les.sh"
    mode: "0644"

- name: Check if ligolo-ng agent files already exist
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/ligolo-ng/{{ item }}"
  loop:
    - agent
    - agent.exe
    - proxy
  register: tools_ligolng_existing_files

- name: Install ligolo-ng
  when: tools_ligolng_existing_files.results | selectattr('stat.exists', 'equalto', false) | list | length > 0
  block:
    - name: Get latest ligolo-ng version from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/nicocha30/ligolo-ng/releases/latest
        return_content: true
      register: tools_ligolng_versions
      changed_when: false

    - name: Extract the ligolo-ng version into a variable
      ansible.builtin.set_fact:
        tools_ligolng_version: "{{ tools_ligolng_versions.json.tag_name[1:] }}"

    - name: Create ligolo-ng directory
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/ligolo-ng"
        state: directory
        mode: "0755"

    - name: Download ligolo-ng binaries
      ansible.builtin.get_url:
        url: "https://github.com/nicocha30/ligolo-ng/releases/latest/download/ligolo-ng_{{ item }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/ligolo-ng/"
        mode: "0644"
      loop:
        - "agent_{{ tools_ligolng_version }}_linux_amd64.tar.gz"
        - "agent_{{ tools_ligolng_version }}_windows_amd64.zip"
        - "proxy_{{ tools_ligolng_version }}_linux_amd64.tar.gz"

    - name: Extract ligolo-ng binaries
      ansible.builtin.unarchive:
        src: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/ligolo-ng/ligolo-ng_{{ item }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/ligolo-ng/"
        remote_src: true
      loop:
        - "agent_{{ tools_ligolng_version }}_linux_amd64.tar.gz"
        - "agent_{{ tools_ligolng_version }}_windows_amd64.zip"
        - "proxy_{{ tools_ligolng_version }}_linux_amd64.tar.gz"

    - name: Remove the archives
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/ligolo-ng/ligolo-ng_{{ item }}"
        state: absent
      loop:
        - "agent_{{ tools_ligolng_version }}_linux_amd64.tar.gz"
        - "agent_{{ tools_ligolng_version }}_windows_amd64.zip"
        - "proxy_{{ tools_ligolng_version }}_linux_amd64.tar.gz"

- name: Get latest RustScan version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/bee-san/rustscan/releases/latest
    return_content: true
  register: tools_rustscan_versions
  changed_when: false

- name: Extract the RustScan version into a variable
  ansible.builtin.set_fact:
    tools_rustscan_version: "{{ tools_rustscan_versions.json.tag_name }}"

- name: Create RustScan directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/rustscan"
    state: directory
    mode: "0755"

- name: Download RustScan binaries
  ansible.builtin.get_url:
    url: "https://github.com/bee-san/rustscan/releases/latest/download/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/rustscan/"
    mode: "0644"
  retries: 3
  delay: 3
  loop:
    - x86-linux-rustscan.zip
    - x86_64-linux-rustscan.tar.gz.zip
    - x86-windows-rustscan.exe.zip
    - x86_64-windows-rustscan.exe.zip
    - x86_64-macos-rustscan.tar.gz.zip

- name: Get latest dive version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/wagoodman/dive/releases/latest
    return_content: true
  register: tools_dive_release
  changed_when: false

- name: Extract the dive version into a variable
  ansible.builtin.set_fact:
    tools_dive_version: "{{ tools_dive_release.json.tag_name[1:] }}"

- name: Install dive .deb package
  become: true
  ansible.builtin.apt:
    deb: "https://github.com/wagoodman/dive/releases/latest/download/dive_{{ tools_dive_version }}_linux_amd64.deb"
