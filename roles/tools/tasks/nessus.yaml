---
- name: Download Nessus Debian amd64 package
  ansible.builtin.get_url:
    url: "https://www.tenable.com/downloads/api/v2/pages/nessus/files/Nessus-latest-debian10_amd64.deb"
    dest: "/tmp/nessus_install.deb"
    mode: '0644'

- name: Install Nessus deb package
  become: true
  ansible.builtin.apt:
    deb: "/tmp/nessus_install.deb"
    state: present

- name: Remove Nessus deb package
  ansible.builtin.file:
    path: "/tmp/nessus_install.deb"
    state: absent
