---
- name: Create custom tools directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/custom"
    state: directory
    mode: "0755"

- name: Copy custom tooling scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/Documents/tools/custom/{{ item | basename }}"
    mode: "0755"
  with_fileglob:
    - custom_tooling/*
