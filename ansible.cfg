[defaults]
# Inventory file location
inventory = ./inventory/hosts.yaml

# Gathering
gathering = smart

# Logging
log_path = ./ansible.log

# Performance
forks = 10
timeout = 30

[privilege_escalation]
# The default target is localhost, where sudo needs a password on every run.
# Remote targets also need an SSH login password: pass -k on the command line.
become_ask_pass = True

[ssh_connection]
pipelining = True
# accept-new trusts a host key on first connection but, unlike
# StrictHostKeyChecking=no, still refuses to connect if a known key changes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
